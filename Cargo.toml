[package]
name = "nyx"
version = "0.1.0"
edition = "2021"
description = "nyx-tui: unofficial VulnyX terminal dashboard — machine catalog, downloads, flags, writeups and leaderboard"
license = "MIT"
authors = ["Ouba"]

[dependencies]
anyhow = "1"
crossterm = "0.28"
futures-util = "0.3"
home = "0.5"
md-5 = "0.10"
miniz_oxide = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "cookies",
    "json",
    "stream",
    "gzip",
    "http2",
    "charset",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

[[bin]]
name = "nyx"
path = "src/main.rs"
